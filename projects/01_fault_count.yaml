acceptance_suites:
- id: fault_count_conformance
  version: 1.0.0
  name: Fault Count Conformance
  description: All values are synthetic. Expected values are derived from small enumerated cases and intentional
    boundary conditions; structural validity alone does not verify a production implementation.
  runner: reference
  cases:
  - id: event_window_edges
    name: Event Window Edges
    description: Lower-bound equality is included; upper-bound equality is excluded. Exactly two of four
      observations are eligible.
    feature:
      id: device.fault_count_7d
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      device_id: device_1
    source_rows:
      device_registry:
      - tenant_id: tenant_a
        device_id: device_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      fault_events:
      - event_id: before_lower
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-05-31T23:59:59Z'
        available_at: '2026-05-31T23:59:59Z'
        is_fault: true
      - event_id: at_lower
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-01T00:00:00Z'
        available_at: '2026-06-01T00:00:00Z'
        is_fault: true
      - event_id: before_upper
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-07T23:59:59Z'
        available_at: '2026-06-07T23:59:59Z'
        is_fault: true
      - event_id: at_upper
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-08T00:00:00Z'
        available_at: '2026-06-08T00:00:00Z'
        is_fault: true
    context:
      mode: source_as_known
      source_status:
      - source: device_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: fault_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:

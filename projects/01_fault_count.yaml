      delay_seconds: 60
  transform:
    kind: aggregate
    input: faults
    joins: []
    group_by:
    - entity_key: tenant_id
      input: faults
      column: tenant_id
    - entity_key: device_id
      input: faults
      column: device_id
    filter:
      kind: call
      operator: equal
      args:
      - kind: column
        input: faults
        column: is_fault
      - kind: literal
        type: boolean
        value: true
    operation: count
    value: null
    distinct_by: []
    nulls: ignore
  lineage:

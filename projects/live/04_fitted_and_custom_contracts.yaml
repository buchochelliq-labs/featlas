      sha256: 3443fd663591e014d03b70c55e96dc1e8cbedcccc56ff93fea15a1419ed283bc
    contract:
      entrypoint: example.priority_score.v1
      inputs:
      - name: zscore
        type: number
        nullable: true
        expression:
          kind: feature
          feature: device.fault_count_zscore_7d
          version: 1.0.0
      output_type: number
      output_nullable: true
      deterministic: true
      side_effects: none
      network_access: forbidden
      resource_limits:
        timeout_seconds: 1
        memory_mib: 64

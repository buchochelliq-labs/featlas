- id: device.fault_count_7d
  version: 1.0.0
  name: Fault count in seven days
  description: Number of classified fault observations for a registered device in [as_of - 7 days, as_of),
    using only observations available at as_of.
  owner: example.feature-engineering
  entity: device
  output:
    type: integer
    nullable: true
    unit: count
    description: Number of classified fault observations for a registered device in [as_of - 7 days, as_of),
      using only observations available at as_of.
    constraints:
      minimum: 0
    numeric_tolerance:
      absolute: 0
      relative: 0
  inputs:
  - alias: faults
    source: fault_events
    columns:
    - event_id
    - tenant_id
    - device_id
    - occurred_at
    - available_at
    - is_fault
  dependencies: []
  time:
    timezone: UTC
    window:
      lookback_seconds: 604800
      lower: inclusive
      upper: exclusive
    availability:
      cutoff: as_of
      upper: inclusive
    knowledge_mode: source_as_known
    publication:
      delay_seconds: 60
  transform:
    kind: aggregate
    input: faults
    joins: []
    group_by:
    - entity_key: tenant_id
      input: faults
      column: tenant_id
    - entity_key: device_id
      input: faults
      column: device_id
    filter:
      kind: call
      operator: equal
      args:
      - kind: column
        input: faults
        column: is_fault
      - kind: literal
        type: boolean
        value: true
    operation: count
    value: null
    distinct_by: []
    nulls: ignore
  lineage:
    sources:
    - source: fault_events
      column: event_id
      roles:
      - ordering
      description: Globally unique immutable observation identity, used to collapse exact retransmissions.
        Used for ordering.
    - source: fault_events
      column: tenant_id
      roles:
      - entity_key
      description: Tenant owning the observed device. Used for entity_key.
    - source: fault_events
      column: device_id
      roles:
      - entity_key
      description: Tenant-local observed device identifier. Used for entity_key.
    - source: fault_events
      column: occurred_at
      roles:
      - event_time
      description: Business timestamp of the sensor observation. Used for event_time.
    - source: fault_events
      column: available_at
      roles:
      - availability_time
      description: Earliest instant this exact observation was readable by feature computation. Used for
        availability_time.
    - source: fault_events
      column: is_fault
      roles:
      - filter
      description: True denotes a fault, false a healthy observation, null an unknown classification.
        Used for filter.
    - source: device_registry

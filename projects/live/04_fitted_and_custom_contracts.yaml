- id: device.fault_count_zscore_7d
  version: 1.0.0
  name: Frozen fault-count z-score
  description: Apply the versioned synthetic training-only standard scaler to the same-entity seven-day
    fault count.
  owner: example.feature-engineering
  entity: device
  output:
    type: number
    nullable: true
    unit: standard_deviation
    description: Apply the versioned synthetic training-only standard scaler to the same-entity seven-day
      fault count.
    constraints: {}
    numeric_tolerance:
      absolute: 1.0e-09
      relative: 1.0e-09
  inputs: []
  dependencies:
  - feature: device.fault_count_7d
    version: 1.0.0
    alignment: same_entity_as_of
  time:
    timezone: UTC
    window:
      lookback_seconds: 604800
      lower: inclusive
      upper: exclusive
    availability:
      cutoff: as_of
      upper: inclusive
    knowledge_mode: source_as_known
    publication:
      delay_seconds: 60
  transform:
    kind: learned
    artifact:
      id: fault_count_scaler
      version: 1.0.0
      uri: bundle://examples/artifacts/fault-count-scaler-v1.json
      sha256: e12135251fcd43b4d50b99d014aa84b8270cd760ca1622f2d91353bfa2aa5472
      format: json
      created_at: '2026-02-03T00:00:00Z'
      training_cutoff: '2026-01-31T23:59:59Z'
      training_available_cutoff: '2026-02-02T00:00:00Z'
      split_id: temporal_split_2026_02
    fitting:
      policy: training_split_only
      split_id: temporal_split_2026_02
      training_start: '2026-01-01T00:00:00Z'
      training_end: '2026-02-01T00:00:00Z'
      label_availability_cutoff: '2026-02-02T00:00:00Z'
      description: Synthetic mean 2 and scale 2 stand in for parameters fitted solely from the training
        partition of temporal_split_2026_02. This unsupervised example uses no labels; the recorded label
        cutoff is a conservative upper safety bound. Freeze the artifact before evaluation, use population-standard-deviation
        scaling, reject scale <= 0, and never refit during apply.
    contract:
      entrypoint: example.standard_scaler.apply.v1
      inputs:
      - name: fault_count
        type: integer
        nullable: true
        expression:
          kind: feature
          feature: device.fault_count_7d
          version: 1.0.0
      output_type: number
      output_nullable: true
      deterministic: true
      side_effects: none
      network_access: forbidden
      resource_limits:
        timeout_seconds: 1
        memory_mib: 64
      null_policy: propagate
      description: Read immutable mean and scale from the digest-verified JSON artifact. For finite input
        x, return (x - mean) / scale as finite binary64; propagate null, reject scale <= 0 or invalid
        artifact, and retain dependency missingness state. Artifact split_id must equal the requested
        evaluation split identity.
    required_capabilities:
    - learned.standard_scaler.v1
    - artifact.json.v1
    conformance_suite: fitted_adapter_conformance
  lineage:

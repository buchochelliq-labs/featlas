- id: customer.recent_spend_ratio
  version: 1.0.0
  name: Seven-day share of 30-day spend
  description: The exact pinned seven-day spend divided by 30-day spend for the same customer and as_of.
    A zero denominator produces a successful nullable output via safe_divide.
  owner: example.feature-engineering
  entity: customer
  output:
    type: number
    nullable: true
    unit: ratio
    description: The exact pinned seven-day spend divided by 30-day spend for the same customer and as_of.
      A zero denominator produces a successful nullable output via safe_divide.
    constraints:
      minimum: 0
      maximum: 1
    numeric_tolerance:
      absolute: 1.0e-09
      relative: 1.0e-09
  inputs: []
  dependencies:
  - feature: customer.spend_7d
    version: 1.0.0
    alignment: same_entity_as_of
  - feature: customer.spend_30d
    version: 1.0.0
    alignment: same_entity_as_of
  time:
    timezone: UTC
    window:
      lookback_seconds: 2592000
      lower: inclusive
      upper: exclusive
    availability:
      cutoff: as_of
      upper: inclusive
    knowledge_mode: source_as_known
    publication:
      delay_seconds: 60
  transform:
    kind: expression
    expression:
      kind: call
      operator: safe_divide
      args:
      - kind: feature
        feature: customer.spend_7d
        version: 1.0.0
      - kind: feature
        feature: customer.spend_30d
        version: 1.0.0

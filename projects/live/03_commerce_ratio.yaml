consumers:
- id: spend_training_dataset
  version: 1.0.0
  name: Spend Training Dataset
  description: Synthetic request contract. Request as_of anchors feature windows; requested_at determines
    what published values were visible.
  owner: example.modeling
  feature_set:
    feature_set: customer_spending
    version: 1.0.0
  entity_inputs:
  - entity_key: tenant_id
    input_field: tenant_id
  - entity_key: customer_id
    input_field: customer_id
  time_inputs:
    as_of: as_of
    requested_at: requested_at
    dataset_cutoff: dataset_cutoff
  selection:
    mode: source_as_known
    tie_breaker: sequence
  max_staleness_seconds: 3600
  missing_value_policy: preserve_null
  label:
    source: purchase_events
    value_column: amount_usd_cents
    entity_keys:
    - entity_key: tenant_id
      column: tenant_id
    - entity_key: customer_id
      column: customer_id
    event_time_column: purchased_at
    available_time_column: available_at
    horizon_seconds: 604800
    lower: inclusive
    upper: exclusive
    availability_policy: at_or_before_dataset_cutoff
    description: Sum all observed purchase amounts during [feature as_of, feature as_of + 7 days), independently
      of feature inputs. This simple synthetic label uses every purchase state and signed amount; a business-specific
      settled-only target must define its own filtered label source. Keep only examples whose whole horizon
      is proven complete by the dataset cutoff.
    aggregation: sum
    empty:
      action: value
      value: 0
    incomplete_horizon: exclude
    full_horizon_required: true

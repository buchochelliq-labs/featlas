features:
- id: customer.spend_7d
  version: 1.0.0
  name: Settled spend in seven days
  description: Exact sum of nonnegative settled gross purchase amounts in integer USD cents over the prior
    seven days.
  owner: example.feature-engineering
  entity: customer
  output:
    type: integer
    nullable: true
    unit: USD_cent
    description: Exact sum of nonnegative settled gross purchase amounts in integer USD cents over the
      prior seven days.
    constraints:
      minimum: 0
    numeric_tolerance:
      absolute: 0
      relative: 0
  inputs:
  - alias: purchases
    source: purchase_events
    columns:
    - transaction_id
    - tenant_id
    - customer_id
    - purchased_at
    - available_at
    - amount_usd_cents
    - status
  dependencies: []
  time:
    timezone: UTC
    window:
      lookback_seconds: 604800
      lower: inclusive
      upper: exclusive
    availability:
      cutoff: as_of
      upper: inclusive
    knowledge_mode: source_as_known
    publication:
      delay_seconds: 60
  transform:
    kind: aggregate
    input: purchases
    joins: []
    group_by:
    - entity_key: tenant_id
      input: purchases
      column: tenant_id
    - entity_key: customer_id
      input: purchases
      column: customer_id
    filter:
      kind: call
      operator: and
      args:
      - kind: call
        operator: equal
        args:
        - kind: column
          input: purchases
          column: status
        - kind: literal
          type: string
          value: settled
      - kind: call
        operator: greater_or_equal
        args:
        - kind: column
          input: purchases
          column: amount_usd_cents
        - kind: literal
          type: integer
          value: 0
    operation: sum
    value:
      kind: column
      input: purchases
      column: amount_usd_cents
    distinct_by: []
    nulls: ignore
  lineage:
    sources:
    - source: purchase_events
      column: transaction_id
      roles:
      - ordering
      description: Immutable purchase identity used for exact retransmission deduplication. Used for ordering.
    - source: purchase_events
      column: tenant_id
      roles:
      - entity_key
      description: Merchant/account tenant boundary. Used for entity_key.
    - source: purchase_events
      column: customer_id
      roles:
      - entity_key
      description: Customer identifier unique within one tenant. Used for entity_key.
    - source: purchase_events
      column: purchased_at
      roles:
      - event_time
      description: Business timestamp when the purchase occurred. Used for event_time.
    - source: purchase_events
      column: available_at
      roles:
      - availability_time
      description: Earliest instant this purchase observation was available to the feature system. Used
        for availability_time.
    - source: purchase_events
      column: amount_usd_cents
      roles:
      - value
      - filter
      description: Nonnegative gross purchase amount in USD cents; the feature explicitly excludes negative
        adjustments. Used for value, filter.
    - source: purchase_events
      column: status
      roles:
      - filter
      description: Business state. Only the literal settled is included; pending and cancelled observations
        are excluded. Used for filter.
    - source: customer_registry
      column: tenant_id
      roles:
      - entity_key
      - ordering
      - population
      description: Tenant boundary; the same local entity ID may exist in different tenants. Used for
        entity_key, ordering, population.
    - source: customer_registry
      column: customer_id
      roles:
      - entity_key
      - ordering
      - population
      description: Customer identifier unique only within one tenant. Used for entity_key, ordering, population.
    - source: customer_registry
      column: registered_at
      roles:
      - event_time
      - population
      description: Business instant when this entity joined the population. Used for event_time, population.
    - source: customer_registry
      column: available_at
      roles:
      - availability_time
      - population
      description: Instant this registration became visible to the feature system. Used for availability_time,
        population.
    dependencies: []
    code: null
  missingness:

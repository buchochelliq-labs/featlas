acceptance_suites:
- id: commerce_conformance
  version: 1.0.0
  name: Commerce Conformance
  description: All values are synthetic. Expected values are derived from small enumerated cases and intentional
    boundary conditions; structural validity alone does not verify a production implementation.
  runner: reference
  cases:
  - id: seven_day_sum
    name: Seven Day Sum
    description: 'Only the recent settled nonnegative purchase contributes: older, pending and negative
      adjustment rows are excluded.'
    feature:
      id: customer.spend_7d
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      purchase_events:
      - transaction_id: recent
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T12:00:00Z'
        available_at: '2026-06-07T12:00:00Z'
        amount_usd_cents: 2500
        status: settled
      - transaction_id: older
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-05-20T12:00:00Z'
        available_at: '2026-05-20T12:00:00Z'
        amount_usd_cents: 7500
        status: settled
      - transaction_id: pending
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T13:00:00Z'
        available_at: '2026-06-07T13:00:00Z'
        amount_usd_cents: 30000
        status: pending
      - transaction_id: adjustment
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T14:00:00Z'
        available_at: '2026-06-07T14:00:00Z'
        amount_usd_cents: -100
        status: settled
    context:
      mode: source_as_known
      source_status:
      - source: customer_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: purchase_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          customer_id: customer_1
        value: 2500
        state: ok
  - id: thirty_day_lower_boundary
    name: Thirty Day Lower Boundary
    description: The purchase exactly 30 elapsed days before as_of is included and the purchase one second
      earlier is excluded.
    feature:
      id: customer.spend_30d
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      purchase_events:
      - transaction_id: exact_lower
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-05-09T00:00:00Z'
        available_at: '2026-05-09T00:00:00Z'
        amount_usd_cents: 1000
        status: settled
      - transaction_id: before_lower
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-05-08T23:59:59Z'
        available_at: '2026-05-08T23:59:59Z'
        amount_usd_cents: 2000
        status: settled
      - transaction_id: recent
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T12:00:00Z'
        available_at: '2026-06-07T12:00:00Z'
        amount_usd_cents: 2500
        status: settled
    context:
      mode: source_as_known
      source_status:
      - source: customer_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: purchase_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          customer_id: customer_1
        value: 3500
        state: ok
  - id: derived_ratio
    name: Derived Ratio
    description: The numerator is 2500 USD cents and denominator is 10000 USD cents; cancellation of matching
      units yields 0.25.
    feature:
      id: customer.recent_spend_ratio
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      purchase_events:
      - transaction_id: recent
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T12:00:00Z'
        available_at: '2026-06-07T12:00:00Z'
        amount_usd_cents: 2500
        status: settled
      - transaction_id: older
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-05-20T12:00:00Z'
        available_at: '2026-05-20T12:00:00Z'
        amount_usd_cents: 7500
        status: settled
    context:
      mode: source_as_known
      source_status:
      - source: customer_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: purchase_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          customer_id: customer_1
        value: 0.25
        state: ok
  - id: zero_denominator
    name: Zero Denominator
    description: Both dependencies are known zero with complete coverage. safe_divide returns null as
      an intentional successful computation, not an outage or missing-history signal.
    feature:
      id: customer.recent_spend_ratio
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      purchase_events: []
    context:
      mode: source_as_known
      source_status:
      - source: customer_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: purchase_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          customer_id: customer_1
        value: null
        state: ok
  - id: late_purchase_excluded
    name: Late Purchase Excluded
    description: A large recent purchase arrived after as_of and is excluded from both pinned dependencies.
    feature:
      id: customer.recent_spend_ratio
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      purchase_events:
      - transaction_id: recent
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T12:00:00Z'
        available_at: '2026-06-07T12:00:00Z'
        amount_usd_cents: 2500
        status: settled
      - transaction_id: older
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-05-20T12:00:00Z'
        available_at: '2026-05-20T12:00:00Z'
        amount_usd_cents: 7500
        status: settled
      - transaction_id: late
        tenant_id: tenant_a
        customer_id: customer_1
        purchased_at: '2026-06-07T13:00:00Z'
        available_at: '2026-06-08T00:00:01Z'
        amount_usd_cents: 100000
        status: settled
    context:
      mode: source_as_known

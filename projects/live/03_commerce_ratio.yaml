      - source: customer_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: purchase_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          customer_id: customer_1
        value: 0.25
        state: ok
  - id: derived_tenant_isolation
    name: Derived Tenant Isolation
    description: Tenant_a has entirely recent spend and tenant_b has entirely older spend despite sharing
      the same local customer ID.
    feature:
      id: customer.recent_spend_ratio
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      customer_id: customer_1
    - tenant_id: tenant_b
      customer_id: customer_1
    source_rows:
      customer_registry:
      - tenant_id: tenant_a
        customer_id: customer_1

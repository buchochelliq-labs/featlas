[package]
name = "featlas-cli"
description = "fe-spec command-line interface and MCP stdio server over the featlas core."
version.workspace = true
edition.workspace = true
# rs-rich needs Rust 1.90; the libraries and Python bindings keep the workspace minimum.
rust-version = "1.90"
license.workspace = true

[[bin]]
name = "fe-spec"
path = "src/main.rs"

[dependencies]
featlas-core = { path = "../featlas-core" }
featlas-adapters = { path = "../featlas-adapters" }
featlas-api = { path = "../featlas-api" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
clap.workspace = true
rich.workspace = true
jsonschema.workspace = true

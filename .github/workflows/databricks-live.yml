name: databricks-live

# Live acceptance on Databricks (Free Edition, serverless) with the service principal stored in
# the `databricks-free` environment. Expected environment secrets (or variables for the host):
#   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
# OAuth scopes requested for the SP token: environment variable DATABRICKS_SCOPES (space
# separated), default `databricks-connect` -- the suite only talks to serverless compute over
# Spark Connect; table access is governed by the Unity Catalog grants above. The SDK would
# otherwise request `all-apis`, which a least-privilege (scoped) secret rejects.
# The SP needs USE CATALOG on `featlas` and USE SCHEMA, CREATE TABLE, SELECT, MODIFY on
# `featlas.synthetic_raw` and `featlas.synthetic_features` (plus CREATE SCHEMA on the catalog if
# those schemas do not exist yet). All tables created by a run carry the run id and are dropped.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Also run the platform job (scheduled job, Online Feature Store + Feature Serving, Feature Views)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "crates/featlas-adapters/src/databricks.rs"
      - "crates/featlas-adapters/src/databricks_caps.rs"
      - "crates/featlas-core/src/**"
      - "python/featlas_databricks/**"
      - "python/tests/**"
      - "projects/live/**"
      - ".github/workflows/databricks-live.yml"

concurrency:
  group: databricks-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: databricks-free
    timeout-minutes: 45
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_SCOPES: ${{ vars.DATABRICKS_SCOPES || 'databricks-connect' }}
      FEATLAS_SPARK: databricks
      TZ: UTC
    steps:
      - name: Check required configuration (names only)
        run: |
          missing=""
          [ -n "$DATABRICKS_HOST" ] || missing="$missing DATABRICKS_HOST"
          [ -n "$DATABRICKS_CLIENT_ID" ] || missing="$missing DATABRICKS_CLIENT_ID"
          [ -n "$DATABRICKS_CLIENT_SECRET" ] || missing="$missing DATABRICKS_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing in environment databricks-free:$missing"; exit 1; fi
          echo "Requested OAuth scopes: $DATABRICKS_SCOPES"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # databricks-connect provides the pyspark client; do not install pyspark alongside it.
      - run: python -m pip install "maturin>=1.16,<2" pytest PyYAML==6.0.3 "databricks-connect>=16.4,<18"
      - run: cargo build --release -p featlas-cli
      - run: cd python && maturin build --release --out dist && pip install dist/*.whl
      - name: Record client versions
        run: |
          mkdir -p live-evidence
          python -m pip freeze | grep -iE "databricks|pyspark|featlas|protobuf|grpc" > live-evidence/pip-freeze.txt
          git rev-parse HEAD > live-evidence/commit.txt
          sha256sum target/release/fe-spec >> live-evidence/commit.txt
          # The files a passing run vouches for (pinned in crates/featlas-adapters/src/databricks_lock.json).
          sha256sum crates/featlas-adapters/src/databricks.rs python/featlas_databricks/runner.py python/featlas_databricks/cli.py python/featlas_databricks/online.py python/featlas_databricks/feature_views.py > live-evidence/sources.sha256
      - name: Differential suite on Databricks serverless (generated SQL vs goldens and core)
        run: cd python && FEATLAS_DIFFERENTIAL_REPORT=../live-evidence/databricks-differential.json pytest -q -rA tests/test_local_spark_differential.py
      - name: Unity Catalog publication suite
        if: always()
        run: cd python && FEATLAS_LIVE_REPORT=../live-evidence/databricks-live.json pytest -q -rA tests/test_databricks_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databricks-live-evidence
          path: live-evidence/

  # Platform surfaces (manual dispatch only: it creates a job, an Online Feature Store and a
  # serving endpoint, all removed at the end). OAuth scopes: environment variable
  # DATABRICKS_PLATFORM_SCOPES, default below. Extra grants for the SP: CREATE VOLUME, READ VOLUME,
  # WRITE VOLUME and CREATE FUNCTION on featlas.synthetic_raw / featlas.synthetic_features.
  platform:
    if: github.event_name == 'workflow_dispatch' && inputs.platform
    runs-on: ubuntu-latest
    environment: databricks-free
    timeout-minutes: 90
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_SCOPES: ${{ vars.DATABRICKS_PLATFORM_SCOPES || 'databricks-connect jobs files unity-catalog pipelines model-serving model-serving-inference' }}
      FEATLAS_SPARK: databricks
      FEATLAS_PLATFORM: "1"
      # The Feature Engineering client builds an MLflow client: use the workspace, not a local db.
      MLFLOW_TRACKING_URI: databricks
      MLFLOW_REGISTRY_URI: databricks-uc
      TZ: UTC
    steps:
      - name: Check required configuration (names only)
        run: |
          [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_CLIENT_ID" ] && [ -n "$DATABRICKS_CLIENT_SECRET" ] || { echo "::error::Missing Databricks configuration in environment databricks-free"; exit 1; }
          echo "Requested OAuth scopes: $DATABRICKS_SCOPES"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Wheels for the job's serverless environment (the test probes its architecture).
      - name: Build aarch64 wheel (manylinux 2_28)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: "2_28"
          working-directory: python
          args: --release --out ../wheels
      # The runner's own wheel (x86_64, built natively: the cross container above leaves build
      # scripts linked against its glibc in target/).
      # (The container also leaves wheels/ owned by root: build elsewhere, then merge.)
      - run: |
          python -m pip install "maturin>=1.16,<2"
          (cd python && CARGO_TARGET_DIR=../target-host maturin build --release --out ../wheels-host)
          sudo chown -R "$(id -u):$(id -g)" wheels
          cp wheels-host/*.whl wheels/
      - run: python -m pip install pytest PyYAML==6.0.3 sqlglot==30.30.0 "databricks-connect>=16.4,<18" "databricks-feature-engineering>=0.16.0" wheels/featlas-*x86_64*.whl
      - name: Record client versions
        run: |
          mkdir -p platform-evidence
          python -m pip freeze | grep -iE "databricks|pyspark|featlas|mlflow" > platform-evidence/pip-freeze.txt
          git rev-parse HEAD > platform-evidence/commit.txt
          sha256sum wheels/*.whl >> platform-evidence/commit.txt
          sha256sum crates/featlas-adapters/src/databricks.rs python/featlas_databricks/runner.py python/featlas_databricks/cli.py python/featlas_databricks/online.py python/featlas_databricks/feature_views.py > platform-evidence/sources.sha256
      - name: Platform suite (job, online store and serving, Feature Views)
        run: cd python && FEATLAS_WHEEL_DIR=../wheels FEATLAS_PLATFORM_REPORT=../platform-evidence/databricks-platform.json pytest -q -rA tests/test_databricks_platform.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databricks-platform-evidence
          path: platform-evidence/

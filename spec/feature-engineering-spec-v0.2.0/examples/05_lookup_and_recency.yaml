acceptance_suites:
- id: lookup_recency_conformance
  version: 1.0.0
  name: Lookup Recency Conformance
  description: All values are synthetic. Expected values are derived from small enumerated cases and intentional
    boundary conditions; structural validity alone does not verify a production implementation.
  runner: reference
  cases:
  - id: subsecond_recency_floor
    name: Subsecond Recency Floor
    description: The event is 59.9 elapsed seconds before as_of; the required floor rule yields integer
      59.
    feature:
      id: device.last_fault_age_seconds
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      device_id: device_1
    source_rows:
      device_registry:
      - tenant_id: tenant_a
        device_id: device_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      fault_events:
      - event_id: fractional
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-07T23:59:00.100Z'
        available_at: '2026-06-07T23:59:00.100Z'
        is_fault: true
    context:
      mode: source_as_known
      source_status:
      - source: device_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: fault_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          device_id: device_1
        value: 59
        state: ok
  - id: known_empty_recency
    name: Known Empty Recency
    description: Complete coverage with no true fault event yields null and the explicit empty state.
    feature:
      id: device.last_fault_age_seconds
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      device_id: device_1
    source_rows:
      device_registry:
      - tenant_id: tenant_a
        device_id: device_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      fault_events: []
    context:
      mode: source_as_known
      source_status:
      - source: device_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      - source: fault_events
        state: available
        coverage_start: '2026-01-01T00:00:00Z'
        coverage_end: '2026-06-09T00:00:00Z'
      capabilities:
      - core.aggregate
      - core.expression
      - core.revision_reconstruction
      - core.as_of_join
      - core.source_as_known
      - core.serving_replay
    expected:
      rows:
      - entity_keys:
          tenant_id: tenant_a
          device_id: device_1
        value: null
        state: empty
  - id: latest_lookup
    name: Latest Lookup
    description: A false observation at 23:59:50 is later than a true observation at 23:59:20, so the
      latest value is false.
    feature:
      id: device.latest_fault_classification
      version: 1.0.0
    as_of: '2026-06-08T00:00:00Z'
    population_rows:
    - tenant_id: tenant_a
      device_id: device_1
    source_rows:
      device_registry:
      - tenant_id: tenant_a
        device_id: device_1
        registered_at: '2026-01-01T00:00:00Z'
        available_at: '2026-01-01T00:00:00Z'
      fault_events:
      - event_id: older
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-07T23:59:20Z'
        available_at: '2026-06-07T23:59:20Z'
        is_fault: true
      - event_id: newer
        tenant_id: tenant_a
        device_id: device_1
        occurred_at: '2026-06-07T23:59:50Z'
        available_at: '2026-06-07T23:59:50Z'
        is_fault: false
    context:
      mode: source_as_known
      source_status:
      - source: device_registry
        state: available
        coverage_start: '2026-01-01T00:00:00Z'

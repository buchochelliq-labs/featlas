      roles:
      - ordering
      description: Globally unique immutable observation identity, used to collapse exact retransmissions.
        Used for ordering.
    - source: fault_events
      column: tenant_id
      roles:
      - entity_key
      description: Tenant owning the observed device. Used for entity_key.
    - source: fault_events
      column: device_id
      roles:
      - entity_key
      description: Tenant-local observed device identifier. Used for entity_key.
    - source: fault_events
      column: occurred_at
      roles:
      - event_time
      - ordering
      description: Business timestamp of the sensor observation. Used for event_time, ordering.
    - source: fault_events
      column: available_at

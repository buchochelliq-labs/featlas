  owner: example.modeling
  feature_set:
    feature_set: device_latest_observations
    version: 1.0.0
  entity_inputs:
  - entity_key: tenant_id
    input_field: tenant_id
  - entity_key: device_id
    input_field: device_id
  time_inputs:
    as_of: as_of
    requested_at: requested_at
  selection:
    mode: source_as_known
    tie_breaker: sequence
  max_staleness_seconds: 3600
  missing_value_policy: preserve_null
  label: null
deployments:
- id: lookup_dev
  version: 1.0.0
  name: Lookup Dev
  description: Declarative synthetic binding example only. These identities and tables are not provisioned,

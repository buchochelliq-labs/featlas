# Complete FeatureEngineeringProject, specification 0.2.0.
# Synthetic contracts only; no adapters are installed or resources provisioned.
spec_version: 0.2.0
kind: FeatureEngineeringProject
metadata:
  id: temperature_history_example
  name: Historical temperature feature
  version: 1.0.0
  description: Synthetic versioned facts and historical dimensions demonstrating source-availability reconstruction
    before event-time filters and tenant-safe valid-time joins.
  owners:
  - example.feature-engineering
  status: draft
  tags:
  - synthetic
  - specification-example
entities:
- id: device
  version: 1.0.0
  name: Device
  description: A registered device identified by the full tenant-scoped composite key.
  owner: example.analytics
  keys:
  - name: tenant_id
    type: string
    description: Tenant isolation boundary.
    source_column: tenant_id
    is_tenant: true
  - name: device_id
    type: string
    description: Tenant-local device identifier.
    source_column: device_id
    is_tenant: false
  population:
    source: device_registry
    mode: as_of_keys
    event_time_upper: inclusive
    availability_upper: inclusive
    deletion_policy: exclude_deleted
sources:
- id: device_registry
  version: 1.0.0
  name: Device registry
  description: One immutable registration row per tenant and device; registration defines population membership
    after it is observed. Decommissioning would require a versioned population source in a new source
    version.
  owner: example.data-platform
  columns:
  - name: tenant_id
    type: string
    description: Tenant boundary; the same local entity ID may exist in different tenants.
    nullable: false
    unit: null
    classification: internal
  - name: device_id
    type: string
    description: Device identifier unique only within one tenant.
    nullable: false
    unit: null
    classification: internal
  - name: registered_at
    type: timestamp
    description: Business instant when this entity joined the population.
    nullable: false
    unit: null
    classification: internal
  - name: available_at
    type: timestamp
    description: Instant this registration became visible to the feature system.
    nullable: false
    unit: null
    classification: internal
  primary_key:
  - tenant_id
  - device_id
  record_semantics:
    kind: append_only
    logical_key:
    - tenant_id
    - device_id
    duplicate_policy: collapse_identical
  time:
    event_time: registered_at
    available_time: available_at
    timezone: UTC
  quality:
    null_key_policy: reject
    invalid_row_policy: reject
    max_lateness_seconds: 86400
    completeness:
      mode: external_status
      description: A persisted synthetic source-status observation supplies an explicit complete event-time
        interval. Empty tables alone prove no coverage; outages are reported separately.
  retention:
    raw_seconds: 31536000
    revision_history_seconds: 31536000
    earliest_reproducible_at: '2026-01-01T00:00:00Z'
  lineage:
    description: Synthetic example table constructed solely for this specification; no customer, production
      or measured data is represented.
    upstream_columns:
    - column: tenant_id
      origin: synthetic.device_registry.tenant_id
      description: 'Created as a synthetic fixture field: Tenant boundary; the same local entity ID may
        exist in different tenants.'
    - column: device_id
      origin: synthetic.device_registry.device_id
      description: 'Created as a synthetic fixture field: Device identifier unique only within one tenant.'
    - column: registered_at
      origin: synthetic.device_registry.registered_at
      description: 'Created as a synthetic fixture field: Business instant when this entity joined the
        population.'
    - column: available_at
      origin: synthetic.device_registry.available_at
      description: 'Created as a synthetic fixture field: Instant this registration became visible to
        the feature system.'
    code: null
- id: temperature_readings
  version: 1.0.0
  name: Versioned temperature readings
  description: Each reading_id is a logical observation. Available revisions can correct the event timestamp,
    value, or retract the reading. Select its latest available revision before any time-window or value
    filter.
  owner: example.data-platform
  columns:
  - name: reading_id
    type: string
    description: Stable logical sensor reading identity across corrections.
    nullable: false
    unit: null
    classification: internal
  - name: revision_no
    type: integer
    description: Strictly increasing revision ordinal within a reading_id.
    nullable: false
    unit: null
    classification: internal
  - name: tenant_id
    type: string
    description: Tenant owning the sensor.
    nullable: false
    unit: null
    classification: internal
  - name: device_id
    type: string
    description: Tenant-local sensor identifier.
    nullable: false
    unit: null
    classification: internal
  - name: observed_at
    type: timestamp
    description: Correctable business instant when the temperature was measured.
    nullable: false
    unit: null
    classification: internal
  - name: available_at
    type: timestamp
    description: Instant this exact correction became visible to the feature system.
    nullable: false
    unit: null
    classification: internal
  - name: is_deleted
    type: boolean
    description: A true selected revision retracts the entire logical reading.
    nullable: false
    unit: null
    classification: internal
  - name: temperature_c
    type: number
    description: Measured temperature in degrees Celsius; null means an unusable measurement.
    nullable: true
    unit: degree_Celsius
    classification: internal
  primary_key:
  - reading_id
  - revision_no
  record_semantics:
    kind: versioned
    logical_key:
    - reading_id
    duplicate_policy: collapse_identical
    revision:
      order_by:
      - column: revision_no
        direction: desc
      selection: latest_available
      tombstone_column: is_deleted
      tombstone_value: true
  time:
    event_time: observed_at
    available_time: available_at
    timezone: UTC
  quality:
    null_key_policy: reject
    invalid_row_policy: reject
    max_lateness_seconds: 86400
    completeness:
      mode: external_status
      description: A persisted synthetic source-status observation supplies an explicit complete event-time
        interval. Empty tables alone prove no coverage; outages are reported separately.
  retention:
    raw_seconds: 31536000
    revision_history_seconds: 31536000
    earliest_reproducible_at: '2026-01-01T00:00:00Z'
  lineage:
    description: Synthetic example table constructed solely for this specification; no customer, production
      or measured data is represented.
    upstream_columns:
    - column: reading_id
      origin: synthetic.temperature_readings.reading_id
      description: 'Created as a synthetic fixture field: Stable logical sensor reading identity across
        corrections.'
    - column: revision_no
      origin: synthetic.temperature_readings.revision_no
      description: 'Created as a synthetic fixture field: Strictly increasing revision ordinal within
        a reading_id.'
    - column: tenant_id
      origin: synthetic.temperature_readings.tenant_id
      description: 'Created as a synthetic fixture field: Tenant owning the sensor.'
    - column: device_id
      origin: synthetic.temperature_readings.device_id
      description: 'Created as a synthetic fixture field: Tenant-local sensor identifier.'
    - column: observed_at
      origin: synthetic.temperature_readings.observed_at
      description: 'Created as a synthetic fixture field: Correctable business instant when the temperature
        was measured.'
    - column: available_at
      origin: synthetic.temperature_readings.available_at
      description: 'Created as a synthetic fixture field: Instant this exact correction became visible
        to the feature system.'
    - column: is_deleted
      origin: synthetic.temperature_readings.is_deleted
      description: 'Created as a synthetic fixture field: A true selected revision retracts the entire
        logical reading.'
    - column: temperature_c
      origin: synthetic.temperature_readings.temperature_c
      description: 'Created as a synthetic fixture field: Measured temperature in degrees Celsius; null
        means an unusable measurement.'
    code: null
- id: device_threshold_history
  version: 1.0.0
  name: Historical device thresholds
  description: Bitemporal device threshold intervals. Stable interval_id identifies one logical interval
    across corrections to its boundaries; distinct interval IDs preserve legitimate earlier and later
    intervals.
  owner: example.data-platform
  columns:
  - name: tenant_id
    type: string
    description: Tenant boundary, paired with device_id in every dimension join.
    nullable: false
    unit: null
    classification: internal
  - name: device_id
    type: string
    description: Tenant-local device identity.
    nullable: false
    unit: null
    classification: internal
  - name: interval_id
    type: string
    description: Stable device-scoped identity of one valid-time interval, unchanged when either boundary
      is corrected.
    nullable: false
    unit: null
    classification: internal
  - name: valid_from
    type: timestamp
    description: Inclusive business-time interval start, which can be corrected in a later revision.
    nullable: false
    unit: null
    classification: internal
  - name: valid_to
    type: timestamp
    description: Exclusive business-time interval end; null denotes an open-ended interval.
    nullable: true
    unit: null
    classification: internal
  - name: revision_no
    type: integer
    description: Strictly increasing correction ordinal for this stable interval_id.
    nullable: false
    unit: null
    classification: internal
  - name: available_at
    type: timestamp
    description: Earliest instant this interval revision was readable by the feature system.
    nullable: false
    unit: null
    classification: internal
  - name: is_deleted
    type: boolean
    description: A selected true revision removes this logical interval.
    nullable: false
    unit: null
    classification: internal
  - name: critical_threshold_c
    type: number
    description: Temperature at or above this threshold is classified as hot for the interval.
    nullable: false
    unit: degree_Celsius
    classification: internal
  primary_key:
  - tenant_id
  - device_id
  - interval_id
  - revision_no
  record_semantics:
    kind: versioned
    logical_key:
    - tenant_id
    - device_id
    - interval_id
    duplicate_policy: collapse_identical
    revision:
      order_by:
      - column: revision_no
        direction: desc
      selection: latest_available
      tombstone_column: is_deleted
      tombstone_value: true
  time:
    event_time: valid_from
    available_time: available_at
    timezone: UTC
  quality:
    null_key_policy: reject
    invalid_row_policy: reject
    max_lateness_seconds: 86400
    completeness:
      mode: external_status
      description: A persisted synthetic source-status observation supplies an explicit complete event-time
        interval. Empty tables alone prove no coverage; outages are reported separately.
  retention:
    raw_seconds: 31536000
    revision_history_seconds: 31536000
    earliest_reproducible_at: '2026-01-01T00:00:00Z'
  lineage:
    description: Synthetic example table constructed solely for this specification; no customer, production
      or measured data is represented.
    upstream_columns:
    - column: tenant_id
      origin: synthetic.device_threshold_history.tenant_id
      description: 'Created as a synthetic fixture field: Tenant boundary, paired with device_id in every
        dimension join.'
    - column: device_id
      origin: synthetic.device_threshold_history.device_id
      description: 'Created as a synthetic fixture field: Tenant-local device identity.'
    - column: interval_id
      origin: synthetic.device_threshold_history.interval_id
      description: 'Created as a synthetic fixture field: Stable device-scoped identity of one valid-time
        interval, unchanged when either boundary is corrected.'
    - column: valid_from
      origin: synthetic.device_threshold_history.valid_from
      description: 'Created as a synthetic fixture field: Inclusive business-time interval start, which
        can be corrected in a later revision.'
    - column: valid_to
      origin: synthetic.device_threshold_history.valid_to
      description: 'Created as a synthetic fixture field: Exclusive business-time interval end; null denotes
        an open-ended interval.'
    - column: revision_no
      origin: synthetic.device_threshold_history.revision_no
      description: 'Created as a synthetic fixture field: Strictly increasing correction ordinal for this
        stable interval_id.'
    - column: available_at
      origin: synthetic.device_threshold_history.available_at
      description: 'Created as a synthetic fixture field: Earliest instant this interval revision was
        readable by the feature system.'
    - column: is_deleted
      origin: synthetic.device_threshold_history.is_deleted
      description: 'Created as a synthetic fixture field: A selected true revision removes this logical
        interval.'
    - column: critical_threshold_c
      origin: synthetic.device_threshold_history.critical_threshold_c
      description: 'Created as a synthetic fixture field: Temperature at or above this threshold is classified
        as hot for the interval.'
    code: null
relationships:
- id: reading_to_device_threshold
  version: 1.0.0
  name: Reading to historical device threshold
  description: Join each reading to its tenant-scoped device threshold valid at the reading event instant,
    using only threshold revisions available at feature as_of.
  owner: example.device-operations
  from:
    source: temperature_readings
    columns:
    - tenant_id
    - device_id
  to:
    source: device_threshold_history
    columns:
    - tenant_id
    - device_id
  cardinality: many_to_one
  join_type: left
  null_keys: error
  unmatched: preserve_null
  multiple_matches: error
  temporal:
    mode: as_of
    reference: left_event_time
    valid_from: valid_from
    valid_to: valid_to
    lower: inclusive
    upper: exclusive
    available_time_cutoff: feature_as_of
features:
- id: device.hot_reading_count_24h
  version: 1.0.0
  name: Hot readings in 24 hours
  description: Count readings at or above the threshold valid at each reading event time, after source-as-known
    reconstruction and within [as_of - 24 hours, as_of).
  owner: example.feature-engineering
  entity: device
  output:
    type: integer
    nullable: true
    unit: count
    description: Count readings at or above the threshold valid at each reading event time, after source-as-known
      reconstruction and within [as_of - 24 hours, as_of).
    constraints:
      minimum: 0
    numeric_tolerance:
      absolute: 0
      relative: 0
  inputs:
  - alias: readings
    source: temperature_readings
    columns:
    - reading_id
    - revision_no
    - tenant_id
    - device_id
    - observed_at
    - available_at
    - is_deleted
    - temperature_c
  - alias: thresholds
    source: device_threshold_history
    columns:
    - tenant_id
    - device_id
    - interval_id
    - valid_from
    - valid_to
    - revision_no
    - available_at
    - is_deleted
    - critical_threshold_c
  dependencies: []
  time:
    timezone: UTC
    window:
      lookback_seconds: 86400
      lower: inclusive
      upper: exclusive
    availability:
      cutoff: as_of
      upper: inclusive
    knowledge_mode: source_as_known
    publication:
      delay_seconds: 60
  transform:
    kind: aggregate
    input: readings
    joins:
    - relationship: reading_to_device_threshold
      version: 1.0.0
      left_alias: readings
      right_alias: thresholds
    group_by:
    - entity_key: tenant_id
      input: readings
      column: tenant_id
    - entity_key: device_id
      input: readings
      column: device_id
    filter:
      kind: call
      operator: greater_or_equal
      args:
      - kind: column
        input: readings
        column: temperature_c
      - kind: column
        input: thresholds
        column: critical_threshold_c
    operation: count
    value: null
    distinct_by: []
    nulls: ignore
  lineage:
    sources:
    - source: temperature_readings
      column: reading_id
      roles:
      - ordering
      description: Stable logical sensor reading identity across corrections. Used for ordering.
    - source: temperature_readings
      column: revision_no
      roles:
      - ordering
      - revision
      description: Strictly increasing revision ordinal within a reading_id. Used for ordering, revision.
    - source: temperature_readings
      column: tenant_id
      roles:
      - entity_key
      - join_key
      description: Tenant owning the sensor. Used for entity_key, join_key.
    - source: temperature_readings
      column: device_id
      roles:
      - entity_key
      - join_key
      description: Tenant-local sensor identifier. Used for entity_key, join_key.
    - source: temperature_readings
      column: observed_at
      roles:
      - event_time
      description: Correctable business instant when the temperature was measured. Used for event_time.
    - source: temperature_readings
      column: available_at
      roles:
      - availability_time
      description: Instant this exact correction became visible to the feature system. Used for availability_time.
    - source: temperature_readings
      column: is_deleted
      roles:
      - deletion
      description: A true selected revision retracts the entire logical reading. Used for deletion.
    - source: temperature_readings
      column: temperature_c
      roles:
      - filter
      description: Measured temperature in degrees Celsius; null means an unusable measurement. Used for
        filter.
    - source: device_threshold_history
      column: tenant_id
      roles:
      - entity_key
      - ordering
      - join_key
      description: Tenant boundary, paired with device_id in every dimension join. Used for entity_key,
        ordering, join_key.
    - source: device_threshold_history
      column: device_id
      roles:
      - entity_key
      - ordering
      - join_key
      description: Tenant-local device identity. Used for entity_key, ordering, join_key.
    - source: device_threshold_history
      column: interval_id
      roles:
      - ordering
      description: Stable device-scoped identity of one valid-time interval, unchanged when either boundary
        is corrected. Used for ordering.
    - source: device_threshold_history
      column: valid_from
      roles:
      - event_time
      - valid_time
      description: Inclusive business-time interval start, which can be corrected in a later revision.
        Used for event_time, valid_time.
    - source: device_threshold_history
      column: valid_to
      roles:
      - valid_time
      description: Exclusive business-time interval end; null denotes an open-ended interval. Used for
        valid_time.
    - source: device_threshold_history
      column: revision_no
      roles:
      - ordering
      - revision
      description: Strictly increasing correction ordinal for this stable interval_id. Used for ordering,
        revision.
    - source: device_threshold_history
      column: available_at
      roles:
      - availability_time
      description: Earliest instant this interval revision was readable by the feature system. Used for
        availability_time.
    - source: device_threshold_history
      column: is_deleted
      roles:
      - deletion
      description: A selected true revision removes this logical interval. Used for deletion.
    - source: device_threshold_history
      column: critical_threshold_c
      roles:
      - filter
      description: Temperature at or above this threshold is classified as hot for the interval. Used
        for filter.
    - source: device_registry
      column: tenant_id
      roles:
      - entity_key
      - ordering
      - population
      description: Tenant boundary; the same local entity ID may exist in different tenants. Used for
        entity_key, ordering, population.
    - source: device_registry
      column: device_id
      roles:
      - entity_key
      - ordering
      - population
      description: Device identifier unique only within one tenant. Used for entity_key, ordering, population.
    - source: device_registry
      column: registered_at
      roles:
      - event_time
      - population
      description: Business instant when this entity joined the population. Used for event_time, population.
    - source: device_registry
      column: available_at
      roles:
      - availability_time
      - population
      description: Instant this registration became visible to the feature system. Used for availability_time,
        population.
    dependencies: []
    code: null
  missingness:
    empty:
      action: value
      value: 0
    null_input: ignore
    insufficient_history: 'null'
    source_unavailable: 'null'
    execution_failure: error
  quality:
    checks:
    - kind: finite
      severity: error
    on_violation: error
  history:
    required_seconds: 86400
    coverage: contiguous
    earliest_as_of: '2026-02-01T00:00:00Z'
  acceptance:
    suites:
    - temperature_history_conformance
    description: Human-reviewed synthetic golden cases cover the declared behavior. External adapter conformance
      is required for transforms outside the bundled verifier.
feature_sets:
- id: device_temperature

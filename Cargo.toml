[workspace]
resolver = "2"
members = ["crates/featlas-core", "crates/featlas-adapters", "crates/featlas-api", "crates/featlas-cli", "crates/featlas-py"]
# The Python extension is built by maturin (python/pyproject.toml), not by plain `cargo test`.
default-members = ["crates/featlas-core", "crates/featlas-adapters", "crates/featlas-api", "crates/featlas-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.13"
jsonschema = { version = "0.61", default-features = false }
sha2 = "0.10"
hex = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
# Terminal rendering for the CLI's text output (buchochelliq-labs rs-rich, a Rust port of Python rich).
rich = { package = "rs-rich", version = "=0.0.15", default-features = false }
